<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  background-color: #0f172a;
  color: #f8fafc;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.app-container {
  display: flex;
  width: 100%;
  height: 100%;
}

.sidebar {
  width: 260px;
  background-color: #1e293b;
  border-right: 1px solid #334155;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

.sidebar h2 {
  font-size: 1.1rem;
  margin-bottom: 15px;
  color: #94a3b8;
}

#new-chat-btn {
  background-color: #3b82f6;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  margin-bottom: 20px;
  transition: background 0.2s;
}

#new-chat-btn:hover { background-color: #2563eb; }

#history-list {
  flex: 1;
  overflow-y: auto;
}

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  background-color: #0f172a;
}

.chat-header {
  padding: 20px;
  background-color: #1e293b;
  border-bottom: 1px solid #334155;
}

.chat-header h1 { font-size: 1.4rem; }
.chat-header p { font-size: 0.85rem; color: #94a3b8; }

.chat-window {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.5;
  word-break: break-word;
}

.user-message {
  background-color: #3b82f6;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}

.model-message {
  background-color: #1e293b;
  color: #f8fafc;
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  border: 1px solid #334155;
}

.file-preview {
  display: flex;
  align-items: center;
  background: #1e293b;
  padding: 8px 12px;
  margin: 0 20px;
  border-radius: 6px;
  font-size: 0.9rem;
  border: 1px solid #334155;
}

.file-preview.hidden { display: none; }
#remove-file {
  background: none;
  border: none;
  color: #ef4444;
  font-size: 1.2rem;
  cursor: pointer;
  margin-left: auto;
}

.chat-form {
  padding: 20px;
  background-color: #1e293b;
  border-top: 1px solid #334155;
  display: flex;
  align-items: center;
  gap: 10px;
}

.file-btn {
  font-size: 1.4rem;
  cursor: pointer;
  padding: 6px;
}

textarea {
  flex: 1;
  background-color: #0f172a;
  border: 1px solid #334155;
  color: white;
  padding: 12px;
  border-radius: 8px;
  resize: none;
  outline: none;
  max-height: 120px;
}

textarea:focus { border-color: #3b82f6; }

#send-btn {
  background-color: #3b82f6;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
#send-btn:hover { background-color: #2563eb; }
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniChat AI - Polyglot & Multimodal Assistant</title>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar for Chat History -->
    <aside class="sidebar">
      <h2>Conversations</h2>
      <button id="new-chat-btn">+ New Chat</button>
      <div id="history-list"></div>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-main">
      <header class="chat-header">
        <h1>OmniChat 🤖</h1>
        <p>Coding Expert • Empathetic Thinker • Multimodal Parser</p>
      </header>

      <div id="chat-window" class="chat-window">
        <div class="message model-message">
          <p>Hey there! I'm online. I speak every programming language, understand your images and documents, and I'm ready to chat. What are we building today?</p>
        </div>
      </div>

      <!-- File Preview Area -->
      <div id="file-preview" class="file-preview hidden">
        <span id="file-name"></span>
        <button id="remove-file">×</button>
      </div>

      <!-- Input Form -->
      <form id="chat-form" class="chat-form">
        <label for="file-input" class="file-btn" title="Upload Image or Document">📎</label>
        <input type="file" id="file-input" accept="image/*,application/pdf,text/*" hidden>
        
        <textarea id="user-input" placeholder="Ask anything, paste code, or upload a file..." rows="1"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>

  <script>

const SUPABASE_URL = 'https://emkhqrvyhvbtybsotzio.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVta2hxcnZ5aHZidHlic290emlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.TE-VvICsc0uJvHriLlJJ8upgM5beUqPeGccTJt26w68';

let currentUser = null;

// 1. Check user session on startup (or prompt quick login)
async function initAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    // For a quick start, you can trigger an anonymous login or an email sign-in/magic link
    // Example: prompt user to log in or auto-sign in for testing
    const email = prompt("Enter your email to sync chats across devices:");

      alert("Login failed. Check console.");
      console.error(error);
      return;
    }
    currentUser = data.user;
  } else {
    currentUser = session.user;
  }
  
  // Once logged in, load chat history from Supabase
  await loadCloudHistory();
}

// 2. Load History from Supabase Database
async function loadCloudHistory() {
  if (!currentUser) return;
  
  const { data, error } = await supabase
    .from('chats')
    .select('history')
    .eq('user_id', currentUser.id)
    .single();

  if (data && data.history) {
    conversationHistory = data.history;
  } else {
    conversationHistory = []; // Fresh start if no history exists yet
  }
  renderHistory();
}

// 3. Save History to Supabase Database (replaces localStorage)
async function saveCloudHistory() {
  if (!currentUser) return;

  // Upsert history row for this user
  const { error } = await supabase
    .from('chats')
    .upsert({ 
      user_id: currentUser.id, 
      history: conversationHistory,
      updated_at: new Date()
    }, { onConflict: 'user_id' });

  if (error) console.error('Error saving to cloud:', error);
}
