<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhomeo AI - Polyglot & Multimodal Assistant</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712035.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* CSS Variables for Dynamic Dark & Light Theme */
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-msg-bg: #3b82f6;
      --user-msg-text: #ffffff;
      --model-msg-bg: #1e293b;
      --input-bg: #0f172a;
      --status-online: #10b981;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-msg-bg: #2563eb;
      --user-msg-text: #ffffff;
      --model-msg-bg: #f1f5f9;
      --input-bg: #f8fafc;
      --status-online: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Auth Overlay Modal */
    #auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.96);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #auth-modal.hidden { display: none; }

    .auth-card {
      background-color: var(--bg-surface);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-align: center;
      color: var(--text-primary);
    }

    .auth-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
    }

    .auth-input:focus { border-color: var(--accent); }

    .auth-btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .auth-btn:hover { background-color: var(--accent-hover); }

    .auth-switch {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 10px;
    }

    .auth-switch:hover { color: var(--accent); text-decoration: underline; }
    #auth-error { color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }

    /* Main App Layout */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 260px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    #new-chat-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #logout-btn {
      background-color: var(--border-color);
      color: var(--text-muted);
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 15px;
    }
    #logout-btn:hover { background-color: #ef4444; color: white; }

    #install-pwa-btn {
      background-color: var(--status-online);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 10px;
      display: none;
    }

    #history-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-primary);
    }

    .chat-header {
      padding: 20px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 { font-size: 1.4rem; }
    .chat-header p { font-size: 0.85rem; color: var(--text-muted); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover { border-color: var(--accent); }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: var(--status-online);
      color: white;
      font-weight: 600;
    }
    .status-badge.offline { background-color: #ef4444; }

    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: var(--user-msg-bg);
      color: var(--user-msg-text);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .model-message {
      background-color: var(--model-msg-bg);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border-color);
    }

    .file-preview {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      padding: 8px 12px;
      margin: 0 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
    }

    .file-preview.hidden { display: none; }
    #remove-file {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: auto;
    }

    /* Fixed Input Bar */
    .chat-form {
      padding: 20px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tool-btn {
      font-size: 1.3rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 6px;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .tool-btn:hover { color: var(--text-primary); }
    .tool-btn.recording { color: #ef4444; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    textarea {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px;
      border-radius: 8px;
      resize: none;
      outline: none;
      max-height: 120px;
    }

    textarea:focus { border-color: var(--accent); }

    #send-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send-btn:hover { background-color: var(--accent-hover); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message { max-width: 88%; }
    }
  </style>
</head>

    - CAPABILITIES: You process all multimodal inputs, including images, videos, audio recordings, documents, PDFs, and code.
    - TONE: Playful, engaging, supportive, but precise when writing code.
    `;

    // Dark / Light Theme Toggle Logic
    function initTheme() {
      const savedTheme = localStorage.getItem('rhomeo_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('rhomeo_theme', theme);
      if (theme === 'light') {
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Light';
      } else {
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Dark';
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    });

    // PWA & Service Worker Initialization
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPwaBtn.style.display = 'block';
    });

    installPwaBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt = null;
      installPwaBtn.style.display = 'none';
    });

    function updateOnlineStatus() {
      if (navigator.onLine) {
        networkStatus.textContent = 'Online';
        networkStatus.classList.remove('offline');
      } else {
        networkStatus.textContent = 'Offline Mode';
        networkStatus.classList.add('offline');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Auth Event Listeners
    authSwitchMode.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      authTitle.textContent = isSignUpMode ? 'Create Rhomeo Account' : 'Sign In to Rhomeo';
      authSubmitBtn.textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
      authSwitchMode.textContent = isSignUpMode ? 'Already have an account? Sign In' : "Need an account? Sign Up";
      authError.textContent = '';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();

      if (!supabase) {
        authError.textContent = 'Supabase client failed to initialize.';
        return;
      }

      if (isSignUpMode) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          authError.textContent = error.message;
        } else {
          alert('Account created successfully! You can now sign in.');
          isSignUpMode = false;
          authTitle.textContent = 'Sign In to Rhomeo';
          authSubmitBtn.textContent = 'Sign In';
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          authError.textContent = error.message;
        } else {
          currentUser = data.user;
          authModal.classList.add('hidden');
          await loadCloudHistory();
        }
      }
    });

    logoutBtn.addEventListener('click', async () => {
      if (supabase) await supabase.auth.signOut();
      currentUser = null;
      conversationHistory = [];
      authModal.classList.remove('hidden');
      renderHistory();
    });

    async function initApp() {
      initTheme();
      updateOnlineStatus();
      if (supabase) {
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            currentUser = session.user;
            authModal.classList.add('hidden');
            await loadCloudHistory();
            return;
          }
        } catch (err) {
          console.warn("Session retrieval error:", err);
        }
      }
      authModal.classList.remove('hidden');
    }

    async function loadCloudHistory() {
      if (!currentUser || !supabase) return;
      const { data } = await supabase
        .from('chats')
        .select('history')
        .eq('user_id', currentUser.id)
        .single();

      conversationHistory = (data && data.history) ? data.history : [];
      renderHistory();
    }

    async function saveHistory() {
      if (currentUser && supabase) {
        await supabase.from('chats').upsert({ 
          user_id: currentUser.id, 
          history: conversationHistory,
          updated_at: new Date()
        }, { onConflict: 'user_id' });
      }
    }

    function renderHistory() {
      chatWindow.innerHTML = '';
      if (conversationHistory.length === 0) {
        appendMessageToDOM('model', "The name's Rhomeo! I'm online and ready. Send text, voice notes, documents, pictures, or videos!");
        return;
      }
      conversationHistory.forEach(msg => {
        const textPart = msg.parts.find(p => p.text)?.text || "[Multimodal Attachment Attached]";
        appendMessageToDOM(msg.role === 'user' ? 'user' : 'model', textPart);
      });
    }

    function appendMessageToDOM(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role === 'user' ? 'user-message' : 'model-message');
      const p = document.createElement('p');
      p.textContent = text;
      msgDiv.appendChild(p);
      chatWindow.appendChild(msgDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Voice Recording Logic
    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataaut type="file" id="file-input" accept="image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/*" hidden>
        
        <textarea id="user-input" placeholder="Ask anything, paste code, or attach media/docs..." rows="1"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
