<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhomeo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161b22">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d38;--text:#e6edf3;--mute:#8b96a5;--accent:#5b9dff;--onaccent:#07111f;--user:#1d3557;--danger:#ff7b72;--code:#0a0d12}
[data-theme=light]{--bg:#f6f7f9;--panel:#fff;--line:#dde1e7;--text:#1b2230;--mute:#667085;--accent:#2563eb;--onaccent:#fff;--user:#dbe8ff;--danger:#c0362c;--code:#f0f2f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#auth form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#auth h1{font-size:1.9rem;letter-spacing:-.02em}
#auth p{color:var(--mute)}
input,textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit;width:100%}
.btn{background:var(--accent);color:var(--onaccent);font-weight:600;border-radius:10px;padding:12px 16px}
.btn:disabled{opacity:.5}
.link{color:var(--accent);text-align:left}
#auth-err{color:var(--danger);min-height:1.4em;font-size:.9rem}
aside{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;flex-shrink:0}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;border-radius:8px;padding-left:10px}
.row.on{background:var(--bg)}
.row .t{flex:1;text-align:left;padding:9px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .x{padding:8px;color:var(--mute);font-size:.95rem}
.row .x:hover{color:var(--text)}
.foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--mute)}
.foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot div{display:flex;gap:16px}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h2{font-size:1rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none;font-size:1.4rem;padding:0 6px}
#msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(760px,88%);padding:11px 15px;border-radius:14px;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--user);white-space:pre-wrap;border-bottom-right-radius:4px}
.a{align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-bottom-left-radius:4px}
.a p{margin:0 0 .7em}.a p:last-child{margin:0}
.a ul,.a ol{padding-left:1.3em;margin:0 0 .7em}
.a code{font:.88em ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px}
.a pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 .7em;overflow-x:auto}
.a pre code{background:none;padding:0}
.cp{position:absolute;top:6px;right:6px;font-size:.75rem;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:320px}
.empty b{display:block;color:var(--text);font-size:1.25rem;margin-bottom:6px}
#note{font-size:.85rem;color:var(--danger);padding:0 16px;min-height:0}
#chip{margin:0 16px 6px;font-size:.88rem;color:var(--mute);display:flex;gap:8px;align-items:center}
form#f{display:flex;gap:8px;align-items:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#input{resize:none;max-height:140px}
#attach{font-size:1.3rem;padding:8px}
@media(max-width:760px){
aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top))}
aside.open{transform:none}
#menu{display:block}
.m{max-width:94%}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div id="auth">
  <form id="auth-form">
    <h1>Rhomeo</h1>
    <p id="auth-sub">Sign in to pick up your chats on any device.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
    <div id="auth-err" role="alert"></div>
    <button class="btn" id="auth-go" type="submit">Sign in</button>
    <button class="link" id="auth-swap" type="button">New here? Create an account</button>
  </form>
</div>

<aside id="side">
  <button class="btn" id="new">New chat</button>
  <div id="list"></div>
  <div class="foot">
    <span class="who" id="who"></span>
    <div><button id="theme">Switch theme</button><button id="out">Sign out</button></div>
  </div>
</aside>

<main>
  <header><button id="menu" aria-label="Open chats">☰</button><h2 id="title">New chat</h2></header>
  <div id="msgs"></div>
  <div id="note" role="alert"></div>
  <div id="chip" class="hidden"><span id="chipname"></span><button id="unattach" aria-label="Remove attachment">Remove</button></div>
  <form id="f">
    <button type="button" id="attach" aria-label="Attach image or PDF">📎</button>
    <input type="file" id="file" accept="image/*,application/pdf" hidden>
    <textarea id="input" rows="1" placeholder="Ask anything, paste code, or attach an image or PDF"></textarea>
    <button class="btn" id="send" type="submit">Send</button>
  </form>
</main>

<script>
const SB_URL = 'https://emkhqrvyhvbtybsotzio.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVta2hxcnZ5aHZidHlic290emlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.TE-VvICsc0uJvHriLlJJ8upgM5beUqPeGccTJt26w68';
const FN_URL = SB_URL + '/functions/v1/chat'; // Gemini runs server-side; the key never touches this page
const MAX_FILE = 5 * 1024 * 1024;
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
let user = null, chats = [], cur = null, file = null, ctrl = null, busy = false, signup = false;

/* ---------- helpers ---------- */
const note = t => { $('note').textContent = t || ''; };
function setMd(el, t) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(t));
  el.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'cp'; b.type = 'button'; b.textContent = 'Copy';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.querySelector('code').innerText); b.textContent = 'Copied'; }
      catch { b.textContent = 'Press and hold to copy'; }
      setTimeout(() => b.textContent = 'Copy', 1500);
    };
    pre.appendChild(b);
  });
}
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'm ' + (role === 'user' ? 'u' : 'a');
  if (role === 'user') d.textContent = text; else setMd(d, text);
  const box = $('msgs'); box.appendChild(d); box.scrollTop = box.scrollHeight;
  return d;
}
function showEmpty() {
  $('msgs').innerHTML = '<div class="empty"><b>Rhomeo here.</b>Ask a question, paste code, or attach an image or PDF.</div>';
}
function renderChat() {
  $('title').textContent = cur.title;
  $('msgs').innerHTML = '';
  if (!cur.history.length) return showEmpty();
  cur.history.forEach(m => addMsg(m.role, m.parts.map(p => p.text || '').join('\n')));
}

/* ---------- auth ---------- */
function setMode(s) {
  signup = s;
  $('auth-go').textContent = s ? 'Create account' : 'Sign in';
  $('auth-swap').textContent = s ? 'Have an account? Sign in' : 'New here? Create an account';
  $('auth-sub').textContent = s ? 'Create an account to save chats across devices.' : 'Sign in to pick up your chats on any device.';
  $('pw').autocomplete = s ? 'new-password' : 'current-password';
  $('auth-err').textContent = '';
}
$('auth-swap').onclick = () => setMode(!signup);
$('auth-form').onsubmit = async e => {
  e.preventDefault();
  $('auth-err').textContent = ''; $('auth-go').disabled = true;
  const creds = { email: $('email').value.trim(), password: $('pw').value };
  const { data, error } = signup ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
  $('auth-go').disabled = false;
  if (error) { $('auth-err').textContent = error.message; return; }
  if (!data.session) $('auth-err').textContent = 'Account created. Confirm your email, then sign in.';
};
$('out').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_e, session) => {
  const u = session ? session.user : null;
  if ((u && u.id) === (user && user.id)) return; // ignore token refreshes
  user = u;
  if (u) { $('auth').classList.add('hidden'); $('who').textContent = u.email; setTimeout(loadChats, 0); }
  else { chats = []; cur = null; $('list').innerHTML = ''; $('msgs').innerHTML = ''; $('auth').classList.remove('hidden'); }
});

/* ---------- chats ---------- */
async function loadChats() {
  const { data, error } = await sb.from('chats').select('id,title,updated_at').order('updated_at', { ascending: false });
  if (error) note('Couldn’t load your chats: ' + error.message);
  chats = data || [];
  renderList();
  chats.length ? openChat(chats[0].id) : newChat();
}
function renderList() {
  const l = $('list'); l.innerHTML = '';
  chats.forEach(c => {
    const r = document.createElement('div'); r.className = 'row' + (cur && cur.id === c.id ? ' on' : '');
    const t = document.createElement('button'); t.className = 't'; t.textContent = c.title; t.onclick = () => openChat(c.id);
    const rn = document.createElement('button'); rn.className = 'x'; rn.textContent = 'Rename'; rn.onclick = () => renameChat(c);
    const x = document.createElement('button'); x.className = 'x'; x.textContent = 'Delete'; x.onclick = () => deleteChat(c);
    r.append(t, rn, x); l.appendChild(r);
  });
}
function newChat() {
  if (busy) return;
  cur = { id: null, title: 'New chat', history: [] };
  renderChat(); renderList(); $('side').classList.remove('open');
}
async function openChat(id) {
  if (busy) return;
  const { data, error } = await sb.from('chats').select('id,title,history').eq('id', id).single();
  if (error) return note('Couldn’t open that chat: ' + error.message);
  cur = { id: data.id, title: data.title, history: data.history || [] };
  note(''); renderChat(); renderList(); $('side').classList.remove('open');
}
async function renameChat(c) {
  const t = prompt('Rename chat', c.title);
  if (!t || !t.trim()) return;
  const { error } = await sb.from('chats').update({ title: t.trim() }).eq('id', c.id);
  if (error) return note('Couldn’t rename: ' + error.message);
  c.title = t.trim(); if (cur && cur.id === c.id) { cur.title = c.title; $('title').textContent = c.title; }
  renderList();
}
async function deleteChat(c) {
  if (!confirm('Delete “' + c.title + '”? This can’t be undone.')) return;
  const { error } = await sb.from('chats').delete().eq('id', c.id);
  if (error) return note('Couldn’t delete: ' + error.message);
  chats = chats.filter(x => x.id !== c.id);
  if (cur && cur.id === c.id) chats.length ? openChat(chats[0].id) : newChat();
  renderList();
}
async function saveChat() {
  const row = { user_id: user.id, title: cur.title, history: cur.history, updated_at: new Date().toISOString() };
  if (cur.id) {
    const { error } = await sb.from('chats').update(row).eq('id', cur.id);
    if (error) note('Couldn’t save this chat: ' + error.message);
    const c = chats.find(x => x.id === cur.id); if (c) c.updated_at = row.updated_at;
    chats.sort((a, b) => b.updated_at.localeCompare(a.updated_at));
  } else {
    const { data, error } = await sb.from('chats').insert(row).select('id').single();
    if (error) return note('Couldn’t save this chat: ' + error.message);
    cur.id = data.id; chats.unshift({ id: cur.id, title: cur.title, updated_at: row.updated_at });
  }
  renderList();
}

/* ---------- attachments ---------- */
$('attach').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > MAX_FILE) { note('That file is over 5 MB. Choose a smaller image or PDF.'); e.target.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { file = { name: f.name, mime: f.type, data: r.result.split(',')[1] }; $('chipname').textContent = 'Attached: ' + f.name; $('chip').classList.remove('hidden'); note(''); };
  r.readAsDataURL(f);
};
function clearFile() { file = null; $('file').value = ''; $('chip').classList.add('hidden'); }
$('unattach').onclick = clearFile;

/* ---------- send ---------- */
function setBusy(b) {
  busy = b; $('send').textContent = b ? 'Stop' : 'Send'; $('send').type = b ? 'button' : 'submit';
}
$('send').onclick = () => { if (busy && ctrl) ctrl.abort(); };
$('f').onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  const text = $('input').value.trim();
  if (!text && !file) return;
  note('');
  const sent = file;
  const live = [];                    // what Gemini receives this turn
  const kept = [];                    // what we save (no raw file data yet)
  if (text) { live.push({ text }); kept.push({ text }); }
  if (sent) { live.push({ inline_data: { mime_type: sent.mime, data: sent.data } }); kept.push({ text: '[Attached: ' + sent.name + ']' }); }
  if (!cur.history.length) { $('msgs').innerHTML = ''; cur.title = (text || sent.name).slice(0, 40); $('title').textContent = cur.title; }
  addMsg('user', kept.map(p => p.text).join('\n'));
  $('input').value = ''; $('input').style.height = 'auto'; clearFile();

  const box = addMsg('model', '…');
  let out = '';
  setBusy(true); ctrl = new AbortController();
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(FN_URL, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SB_KEY },
      body: JSON.stringify({ contents: cur.history.concat({ role: 'user', parts: live }) })
    });
    if (!r.ok) throw new Error(r.status === 429 ? 'Rhomeo is busy or you’ve hit today’s message limit. Try again in a bit.' : 'Rhomeo couldn’t reply (error ' + r.status + ').');
    const rd = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      out += dec.decode(value, { stream: true }); setMd(box, out);
      $('msgs').scrollTop = $('msgs').scrollHeight;
    }
  } catch (err) {
    if (err.name !== 'AbortError') { note(err.message || 'Something went wrong. Check your connection and try again.'); if (!out) box.remove(); }
  }
  setBusy(false); ctrl = null;
  if (out) {
    cur.history.push({ role: 'user', parts: kept }, { role: 'model', parts: [{ text: out }] });
    await saveChat();
  } else if (!cur.history.length) { showEmpty(); }
};
$('input').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(min-width:761px)').matches) { e.preventDefault(); $('f').requestSubmit(); } });

/* ---------- chrome ---------- */
$('new').onclick = newChat;
$('menu').onclick = () => $('side').classList.toggle('open');
function theme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('rhomeo_theme', t); } catch {} }
$('theme').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
try { const t = localStorage.getItem('rhomeo_theme'); if (t) theme(t); } catch {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
sb.auth.getSession(); // triggers onAuthStateChange for returning users
</script>
</body>
</html>
